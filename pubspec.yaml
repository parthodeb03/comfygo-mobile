name: comfygo
description: "ComfyGo - Travel Agency App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.4
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # UI Components
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  
  # Date/Time
  intl: ^0.19.0
  
  # Utils
  equatable: ^2.0.7
  go_router: ^14.8.1
  
  # Rating
  flutter_rating_bar: ^4.0.1
  pdf: ^3.13.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/divisions/
    - assets/images/spots/
    - assets/icons/
    - assets/fonts/

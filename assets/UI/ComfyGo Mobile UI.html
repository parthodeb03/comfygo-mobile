<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ComfyGo Mobile UI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* ===== TOKENS (map 1:1 to Flutter ThemeExtension) ===== */
:root{--bg:#F6F8F5;--surface:#FFFFFF;--primary:#1B5239;--onP:#FFFFFF;--sage:#9DB98E;--text:#17372A;--text2:#6C7B73;--line:#E6EBE6;--accent:#F2A93B;--mint:#E3EFE3;--sh:0 8px 24px rgba(27,82,57,.10);--fb:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1A14;--surface:#17251D;--primary:#8FD0A8;--onP:#0F2A1D;--text:#EDEFE6;--text2:#A9B8AE;--line:#2A3B31;--mint:#1F3328;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0F1A14;--surface:#17251D;--primary:#8FD0A8;--onP:#0F2A1D;--text:#EDEFE6;--text2:#A9B8AE;--line:#2A3B31;--mint:#1F3328;--sh:0 8px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#dfe5df;font-family:var(--fb);color:var(--text)}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 10px #fff}
@media (max-width:430px){body{display:block}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.h1{font:400 30px/38px var(--fb);letter-spacing:-.5px}.h1 b{font-weight:800}.t20{font:700 20px/26px var(--fb)}.t16{font:700 16px/22px var(--fb)}.b14{font:400 14px/22px var(--fb);color:var(--text2)}.l12{font:500 12px/16px var(--fb);color:var(--text2)}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--sh)}
.round{width:48px;height:48px;border-radius:50%;background:var(--surface);box-shadow:var(--sh);display:grid;place-items:center;color:var(--text);flex-shrink:0}
.pillbtn{height:56px;border-radius:999px;background:var(--primary);color:var(--onP);font:700 16px var(--fb);display:flex;align-items:center;justify-content:center;transition:transform .15s}.pillbtn:active{transform:scale(.97)}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 8px;border-radius:16px;background:var(--surface);box-shadow:var(--sh);font:600 14px var(--fb);white-space:nowrap;border-bottom:2px solid transparent;color:var(--text);transition:border-color .25s}.chip.on{border-bottom-color:var(--accent)}
.chip i{width:28px;height:28px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--primary)}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 20px 12px}.row::-webkit-scrollbar{display:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(27,82,57,.12);display:flex;align-items:center;justify-content:space-around;padding:0 12px 6px}
.nav button{width:56px;height:46px;border-radius:18px;display:grid;place-items:center;color:var(--text2);transition:background .3s,color .3s,transform .3s cubic-bezier(.22,1,.36,1)}.nav button.on{background:var(--primary);color:var(--onP);transform:scale(1.06)}
.tab{position:relative;padding:8px 2px;font:600 14px var(--fb);color:var(--text2)}.tab.on{color:var(--text)}.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px;animation:line .3s ease-out}
@keyframes line{from{transform:scaleX(0)}}
.rise{animation:rise .4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*60ms)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.pop{animation:pp .3s cubic-bezier(.22,1,.36,1)}@keyframes pp{50%{transform:scale(1.25)}}
.glass{background:rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:999px}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* ===== GRADIENT TOKENS + SMOOTH TRANSITIONS ===== */
:root{--g-main:linear-gradient(135deg,#1B5239 0%,#26704C 55%,#34865B 100%);--g-sage:linear-gradient(170deg,#B7D1A5 0%,#9DB98E 45%,#82A777 100%);--g-bg:linear-gradient(180deg,#F8FBF6 0%,#EEF5EA 100%);--g-card:linear-gradient(160deg,#FFFFFF 0%,#F4F9F1 100%);--g-mint:linear-gradient(135deg,#E8F3E4,#CFE6D3);--g-accent:linear-gradient(90deg,#F2A93B,#F6D365)}
:root[data-theme=dark]{--g-main:linear-gradient(135deg,#8FD0A8 0%,#6FBF92 55%,#A3D98F 100%);--g-bg:linear-gradient(180deg,#0F1A14 0%,#13231B 100%);--g-card:linear-gradient(160deg,#1B2C22 0%,#142219 100%);--g-mint:linear-gradient(135deg,#25402F,#1B3025)}
.phone{background:var(--g-bg),var(--bg)}
.card,.round,.nav{background:var(--g-card),var(--surface)}
.chip i{background:var(--g-mint)}
.chip{transition:border-color .3s,background .35s,transform .25s cubic-bezier(.22,1,.36,1)}.chip.on{background:var(--g-mint),var(--surface)}.chip:active{transform:scale(.96)}
.pillbtn{background-image:var(--g-main);background-size:180% 100%;background-position:0 0;box-shadow:0 10px 22px color-mix(in srgb,var(--primary) 28%,transparent);transition:background-position .6s cubic-bezier(.22,1,.36,1),transform .15s,box-shadow .3s}.pillbtn:hover{background-position:100% 0}
.nav button.on{background:var(--g-main)}
.role{transition:background .3s,color .3s,border-color .3s}.role.on{background:var(--g-main)}
.tab.on::after{background:var(--g-accent)}
.card,.round{transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(27,82,57,.16)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){.pillbtn,.chip,.role,.card,.round{transition:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none}}
.inp{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);color:var(--text2);transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 15px var(--fb);color:var(--text)}
.inp.bad{border-color:#C23A33}
.err{font:500 12px/16px var(--fb);color:#C23A33;margin-top:6px}.err:empty{display:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.soc{flex:1;height:52px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--fb);color:var(--text)}
.role{flex:1;height:44px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font:600 13px var(--fb);color:var(--text2);transition:background .2s,color .2s,border-color .2s}.role.on{background:var(--primary);border-color:var(--primary);color:var(--onP)}
@media (prefers-reduced-motion:reduce){.rise,.float,.pop,.tab.on::after{animation:none}.nav button,.pillbtn{transition:none}}
</style></head>
<body>
<div class="phone"><div id="app" class="absolute inset-0"></div><div id="toast" class="absolute left-5 right-5 bottom-24 hidden rounded-2xl px-4 py-3 text-center text-sm font-semibold" style="background:var(--primary);color:var(--onP)"></div></div>
<script>

const ic=(n,s=22,f)=>`<svg width='${s}' height='${s}' viewBox='0 0 24 24' fill='${f?'currentColor':'none'}' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='${I[n]}'/></svg>`;
const D=[{id:1,n:'Sreemangal',r:'Sylhet',c:'Tea',p:3200,a:['#2F6B4A','#A8C98B'],km:'42km',t:'2h 40min',d:'Rolling emerald tea estates, misty dawns and the quiet of Lawachara rainforest. Walk the hills, taste seven-layer tea and stay in a garden bungalow.'},
{id:2,n:'Cox’s Bazar',r:'Chattogram',c:'Beach',p:5400,a:['#1F6F8B','#E8D9B0'],km:'390km',t:'7h 15min',d:'The longest natural sea beach in the world. Sunrise walks, fresh seafood and a calm stretch at Inani.'},

const scene=(x,i)=>`<svg viewBox='0 0 200 130' preserveAspectRatio='xMidYMid slice' style='width:100%;height:100%;display:block' aria-hidden='true'><defs><linearGradient id='s${i}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${x.a[1]}'/><stop offset='1' stop-color='#FFF3C4'/></linearGradient></defs><rect width='200' height='130' fill='url(#s${i})'/><circle cx='150' cy='30' r='14' fill='#FFE53B'/><path d='M0 88Q40 58 90 84T200 72V130H0Z' fill='${x.a[0]}' opacity='.55'/><path d='M0 106Q50 84 110 104T200 96V130H0Z' fill='${x.a[0]}'/><g fill='#1B5239'><rect x='34' y='88' width='4' height='16'/><circle cx='36' cy='82' r='11'/><rect x='150' y='92' width='4' height='14'/><circle cx='152' cy='86' r='9'/></g></svg>`;
const S={scr:'intro',id:1,cat:'All',tab:'Overview',dark:matchMedia('(prefers-color-scheme: dark)').matches,fav:{}};
const cats=[['All','grid'],['Beach','sun'],['Mountain','mount'],['Forest','tree'],['Tea','leaf']];
const list=()=>D.filter(x=>S.cat==='All'||x.c===S.cat);
const nav=a=>`<nav class='nav' aria-label='Main'>${[['home','home'],['explore','search'],['bookings','cal'],['saved','heart'],['profile','user']].map(([k,i])=>`<button data-go='${k}' class='${a===k?'on':''}' aria-label='${k}' ${a===k?'aria-current=page':''}>${ic(i)}</button>`).join('')}</nav>`;
const trip=(x,i)=>`<div class='card p-3 rise' style='--i:${i}'><div class='flex items-center gap-3'><div style='width:44px;height:44px;border-radius:50%;overflow:hidden'>${scene(x,i+50)}</div><div class='flex-1'><div class='t16'>${x.n}</div><div class='l12'>${x.km} • ${x.r}</div></div><button data-open='${x.id}' class='round' style='width:44px;height:44px' aria-label='Open ${x.n}'>${ic('ur',18)}</button></div>

const V={

<div class='px-6' style='margin-top:30px'><div class='t20 rise' style='font-size:23px;line-height:34px'>Disc<span style='color:#fff'>ov</span>er The World With Travel Gui<span style='color:#fff'>d</span>er</div><p class='b14 mt-2' style='color:#3C5B48'>Explore destinations, cultures and hidden gems with our travel guide.</p>

saved:()=>`<div class='scr'><div class='px-5 pt-6 h1'><b>Saved</b></div><div class='px-5 mt-4 grid gap-4'>${D.filter(x=>S.fav[x.id]).map(trip).join('')||"<p class='b14'>Nothing saved yet. Tap the heart on a destination to keep it here.</p>"}</div></div>${nav('saved')}`,
bookings:()=>`<div class='scr'><div class='px-5 pt-6 h1'><b>My bookings</b></div><div class='px-5 mt-4 grid gap-3'>${[['Sreemangal','12–14 Nov','Confirmed','check'],['Sundarbans','02–05 Dec','Pending','clock'],['Cox’s Bazar','03–06 Sep','Completed','star']].map(([n,d,s,i],k)=>`<div class='card p-4 flex items-center gap-3 rise' style='--i:${k}'><div class='round' style='width:44px;height:44px;background:var(--mint);box-shadow:none;color:var(--primary)'>${ic(i,20)}</div><div class='flex-1'><div class='t16'>${n}</div><div class='l12'>${d}</div></div><span class='text-xs font-bold px-3 py-1 rounded-full' style='background:var(--mint);color:var(--primary)'>${s}</span></div>`).join('')}</div></div>${nav('bookings')}`,
profile:()=>`<div class='scr'><div class='flex flex-col items-center pt-10'><div class='grid place-items-center t20 text-white' style='width:88px;height:88px;border-radius:50%;background:var(--primary);color:var(--onP)'>P</div><div class='t20 mt-3'>Partho</div><div class='b14'>partho@example.com</div></div><div class='px-5 mt-7 grid gap-3'><button data-dark class='card px-4 flex items-center gap-3 text-left' style='height:60px'><span style='color:var(--primary)'>${ic('moon')}</span><span class='t16 flex-1' style='font-weight:600'>Dark mode</span><span class='relative' style='width:46px;height:26px;border-radius:99px;background:${S.dark?'var(--primary)':'var(--line)'}'><i class='absolute' style='top:3px;left:${S.dark?'23px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s'></i></span></button><button data-go='intro' class='card px-4 text-left t16' style='height:60px;color:#C0453A'>Sign out</button></div></div>${nav('profile')}`,
detail:()=>{const x=D.find(d=>d.id===S.id),T={Overview:`<p class='b14'>${x.d}</p>`,Details:`<p class='b14'>Duration: 3 days, 2 nights<br>Includes: local guide, hotel stay, transport and meals<br>Best season: October to March</p>`,Reviews:`<p class='b14'>“Calm, green and beautifully organised.” <b style='color:var(--text)'>Nusrat</b><br>“Our guide knew every trail.” <b style='color:var(--text)'>Tanvir</b></p>`};
return `<div class='scr' style='padding-bottom:110px'><div class='px-4 pt-4 relative'><div style='height:300px;border-radius:26px;overflow:hidden'>${scene(x,70)}</div><button data-go='home' class='round absolute' style='left:30px;top:30px;width:40px;height:40px' aria-label='Back'>${ic('back',18)}</button><button data-fav='${x.id}' class='round absolute' style='right:30px;top:30px;width:40px;height:40px;color:${S.fav[x.id]?'#E5484D':'var(--text)'}' aria-label='Save'>${ic('heart',18,S.fav[x.id])}</button></div>
<div class='card mx-4 mt-4 p-4'><div class='flex justify-between items-center'><div class='t20'>${x.n}</div><span class='l12 flex items-center gap-1 px-2 py-1 rounded-full' style='background:var(--mint);color:var(--text)'><span style='color:#F2A93B'>${ic('star',13,1)}</span>5.0 reviews</span></div>
<div class='flex justify-between mt-4'>${[['pin','Location',x.r],['clock','Open','24H'],['sun','Temp','28°C']].map(([i,l,v])=>`<div class='flex items-center gap-2'><span class='round' style='width:40px;height:40px;background:var(--mint);box-shadow:none;color:var(--primary)'>${ic(i,18)}</span><div><div class='l12' style='font-size:11px'>${l}</div><div class='t16' style='font-size:14px'>${v}</div></div></div>`).join('')}</div>
<div class='flex justify-between mt-4' style='border-bottom:1px solid var(--line)'>${['Overview','Details','Reviews'].map(t=>`<button data-tab='${t}' class='tab ${S.tab===t?'on':''}'>${t}</button>`).join('')}</div><div class='mt-3'>${T[S.tab]}</div>
<div class='t16 mt-4'>Gallery</div><div class='row' style='padding:8px 0 0'>${D.map((g,i)=>`<div style='width:84px;height:62px;border-radius:12px;overflow:hidden;flex-shrink:0'>${scene(g,80+i)}</div>`).join('')}</div></div></div>
<div class='absolute inset-x-0 bottom-0 flex items-center justify-between px-5' style='height:92px;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(27,82,57,.12)'><div><div class='l12'>Trip Cost</div><div class='t16' style='font-size:18px'>Total: ${money(x.p)}</div></div><button data-book class='pillbtn' style='width:180px'>Book Now</button></div>`}
};
const authShell=(title,sub,body)=>`<div class='scr' style='background:var(--g-sage);padding-bottom:0'><div class='px-5 pt-5 flex items-center justify-between'><button data-go='intro' class='round' aria-label='Back'>${ic('back',18)}</button><svg width='64' height='72' viewBox='0 0 64 72' aria-hidden='true' class='float'><ellipse cx='32' cy='24' rx='15' ry='20' fill='#F2C230'/><ellipse cx='32' cy='24' rx='5' ry='20' fill='#6FA34F'/><path d='M24 41l5 14M40 41l-5 14' stroke='#6b4b2a' stroke-width='1.5'/><rect x='27' y='55' width='10' height='8' rx='2' fill='#B07B3C'/></svg></div><div class='px-6 mt-2 pb-6'><div class='t20 rise' style='font-size:28px;line-height:34px;color:#17372A'>${title}</div><p class='b14 mt-1' style='color:#3C5B48'>${sub}</p></div><div class='rise' style='--i:1;background:var(--bg);border-radius:32px 32px 0 0;padding:24px 20px 40px;min-height:640px'>${body}</div></div>`;
const fld=(id,label,icn,type,ph,val='')=>`<div class='mb-4'><label for='${id}' class='l12 block mb-2' style='color:var(--text);font-weight:600'>${label}</label><div class='inp'><span>${ic(icn,18)}</span><input id='${id}' type='${type}' placeholder='${ph}' value='${val}' autocomplete='off'>${type==='password'?`<button type='button' data-eye='${id}' aria-label='Show password' style='color:var(--text2)'>${ic('eye',18)}</button>`:''}</div><div class='err' id='e-${id}' role='alert'></div></div>`;
const soc=()=>`<div class='flex items-center gap-3 my-5'><i style='flex:1;height:1px;background:var(--line)'></i><span class='l12'>or continue with</span><i style='flex:1;height:1px;background:var(--line)'></i></div><div class='flex gap-3'><button data-toast='Google sign-in is a demo' class='soc'><b style='color:#EA4335'>G</b>Google</button><button data-toast='Facebook sign-in is a demo' class='soc'><b style='color:#1877F2'>f</b>Facebook</button></div>`;
V.signin=()=>authShell('Welcome back','Sign in to continue your journey',`${fld('si-em','Email address','mail','email','you@example.com','partho@example.com')}${fld('si-pw','Password','lock','password','Enter your password','password')}<div class='text-right -mt-2 mb-5'><button data-toast='Reset link sent to your email' class='text-sm font-bold' style='color:var(--primary)'>Forgot password?</button></div><button data-submit='signin' class='pillbtn w-full'><span>Sign in</span></button>${soc()}<p class='text-center b14 mt-6'>Don’t have an account? <button data-go='signup' class='font-bold underline' style='color:var(--text)'>Sign Up</button></p>`);
V.signup=()=>authShell('Create account','Join ComfyGo and explore Bangladesh',`${fld('su-nm','Full name','user','text','Your full name')}${fld('su-ph','Mobile number','phone','tel','+880 1XXX-XXXXXX')}${fld('su-em','Email address','mail','email','you@example.com')}${fld('su-pw','Password','lock','password','At least 6 characters')}<div class='l12 mb-2' style='color:var(--text);font-weight:600'>I am a</div><div class='flex gap-2 mb-5'><button data-role='tourist' class='role on'>Tourist</button><button data-role='guide' class='role'>Guide</button><button data-role='hotel' class='role'>Hotel manager</button></div><label class='flex items-start gap-3 b14'><input id='su-tc' type='checkbox' style='width:20px;height:20px;accent-color:#1B5239;margin-top:2px'><span>I agree to the <b style='color:var(--text)'>Terms</b> and <b style='color:var(--text)'>Privacy Policy</b></span></label><div class='err' id='e-su-tc' role='alert'></div><button data-submit='signup' class='pillbtn w-full mt-5'><span>Create account</span></button><p class='text-center b14 mt-6'>Already have an account? <button data-go='signin' class='font-bold underline' style='color:var(--text)'>Sign in</button></p>`);
function submit(kind,btn){const g=id=>document.getElementById(id),v=id=>g(id).value.trim(),p=kind==='signin'?'si':'su';let ok=true;const bad=(id,m)=>{g(id).closest('.inp').classList.add('bad');g('e-'+id).textContent=m;ok=false};
document.querySelectorAll('.inp').forEach(x=>x.classList.remove('bad'));document.querySelectorAll('.err').forEach(x=>x.textContent='');
if(kind==='signup'&&v('su-nm').length<2)bad('su-nm','Enter your full name');
if(kind==='signup'&&!/^(\+?880|0)1[3-9]\d{8}$/.test(v('su-ph').replace(/[\s-]/g,'')))bad('su-ph','Enter a valid Bangladesh mobile number');
if(!/^\S+@\S+\.\S+$/.test(v(p+'-em')))bad(p+'-em','Enter a valid email address');
if(g(p+'-pw').value.length<6)bad(p+'-pw','Use at least 6 characters');
if(kind==='signup'&&!g('su-tc').checked){g('e-su-tc').textContent='Please accept the terms to continue';ok=false}
if(!ok)return;btn.disabled=true;btn.innerHTML=`<span class='spin'></span>`;
setTimeout(()=>{S.scr='home';render();toast(kind==='signin'?'Welcome back, Partho':'Account created. Welcome to ComfyGo')},900)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-eye],[data-submit],[data-role],[data-toast]');if(!t)return;const d=t.dataset;
if(d.toast){toast(d.toast);return}
if(d.role){document.querySelectorAll('.role').forEach(r=>r.classList.toggle('on',r===t));return}
if(d.eye){const i=document.getElementById(d.eye),show=i.type==='password';i.type=show?'text':'password';t.innerHTML=ic(show?'eyeoff':'eye',18);t.setAttribute('aria-label',show?'Hide password':'Show password');return}
if(d.submit)submit(d.submit,t)});
const root=document.documentElement;
let lastScr=S.scr,lastDark=S.dark;
const paint=()=>{root.setAttribute('data-theme',S.dark?'dark':'light');document.getElementById('app').innerHTML=V[S.scr]()};
const render=()=>{const ch=S.scr!==lastScr||S.dark!==lastDark;lastScr=S.scr;lastDark=S.dark;if(ch&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.startViewTransition(paint);else paint()};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2200)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-open],[data-cat],[data-dark],[data-book],[data-fav],[data-tab]');if(!t)return;const d=t.dataset;
if(d.fav){e.stopPropagation();S.fav[d.fav]=!S.fav[d.fav];render();const h=document.querySelector(`[data-fav='${d.fav}']`);if(h)h.classList.add('pop');return}
if(d.go)S.scr=d.go;else if(d.open){S.id=+d.open;S.tab='Overview';S.scr='detail'}else if(d.cat)S.cat=d.cat;else if(d.tab)S.tab=d.tab;else if('dark' in d)S.dark=!S.dark;else if('book' in d){toast('Booking request sent');return}
render()});
render();
</script></body></html>

<script>
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',sf:'var(--surface)',pr:'var(--primary)',onpr:'var(--onPrimary)',sec:'var(--secondary)',ac:'var(--accent)',tx:'var(--text)',tx2:'var(--text2)',ol:'var(--outline)'}}}}
</script>
<style>
/* ===== DESIGN TOKENS (1:1 with Flutter ThemeExtension) ===== */
:root{--bg:#F6F1E7;--surface:#FFFDF8;--primary:#1F4D3A;--onPrimary:#FFFFFF;--secondary:#8FB39A;--accent:#8A6420;--text:#1C2A22;--text2:#55635A;--outline:#DDD6C4;--ok:#2E7D4F;--wait:#9A6A00;--done:#3E5C76;--moss:#6B8F4E;--fern:#3F7A57;--sand:#E6D8B8;--river:#3E7C8C;--bark:#6B4F3A;--g-main:linear-gradient(135deg,#1F4D3A 0%,#2F6B4A 55%,#4B7F57 100%);--g-bg:linear-gradient(180deg,#F6F1E7 0%,#E8EFDD 55%,#D9E8D6 100%);--g-card:linear-gradient(160deg,#FFFDF8,#F1F5E8);
--fh:'Playfair Display','Hind Siliguri',serif;--fb:'DM Sans','Hind Siliguri',system-ui,sans-serif;
--r-card:24px;--r-input:16px;--r-sheet:28px;--sh1:0 2px 8px rgba(31,77,58,.08);--sh2:0 12px 32px rgba(31,77,58,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A14;--surface:#17251D;--primary:#8FD0A8;--onPrimary:#0F2A1D;--secondary:#4E7A62;--accent:#D9B46A;--text:#EDEFE6;--text2:#A9B8AE;--outline:#2A3B31;--ok:#7ED0A2;--wait:#E3B85C;--done:#9DB8D3;--moss:#9BC47A;--fern:#5FA67A;--sand:#3A4332;--river:#6FB0C0;--bark:#B89677;--g-main:linear-gradient(135deg,#8FD0A8 0%,#6FBF92 55%,#A8D98F 100%);--g-bg:linear-gradient(180deg,#0F1A14 0%,#12231A 55%,#173026 100%);--g-card:linear-gradient(160deg,#17251D,#1D3126)}}
:root[data-theme="dark"]{--bg:#0F1A14;--surface:#17251D;--primary:#8FD0A8;--onPrimary:#0F2A1D;--secondary:#4E7A62;--accent:#D9B46A;--text:#EDEFE6;--text2:#A9B8AE;--outline:#2A3B31;--ok:#7ED0A2;--wait:#E3B85C;--done:#9DB8D3;--moss:#9BC47A;--fern:#5FA67A;--sand:#3A4332;--river:#6FB0C0;--bark:#B89677;--g-main:linear-gradient(135deg,#8FD0A8 0%,#6FBF92 55%,#A8D98F 100%);--g-bg:linear-gradient(180deg,#0F1A14 0%,#12231A 55%,#173026 100%);--g-card:linear-gradient(160deg,#17251D,#1D3126)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c1510;font-family:var(--fb);color:var(--text)}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--g-bg),var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px #1b2a21}
@media (max-width:430px){body{display:block}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
/* type scale = Flutter TextTheme */
.display{font:700 34px/40px var(--fh);letter-spacing:-.5px}.headline{font:700 28px/34px var(--fh);letter-spacing:-.3px}
.title{font:600 22px/28px var(--fh)}.titles{font:700 18px/24px var(--fb)}.body{font:400 16px/24px var(--fb)}.bodys{font:400 14px/20px var(--fb)}.label{font:500 12px/16px var(--fb)}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.art{position:relative;overflow:hidden;color:#fff}.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(8,20,14,.78))}
.card{background:var(--g-card),var(--surface);border-radius:var(--r-card);box-shadow:var(--sh1)}
.btn{height:52px;border-radius:999px;background:var(--g-main);color:var(--onPrimary);font:700 16px var(--fb);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}.btn:active{transform:scale(.97)}
.chip{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--outline);background:var(--surface);font:500 14px var(--fb);white-space:nowrap;color:var(--text)}.chip.on{background:var(--g-main);color:var(--onPrimary);border-color:transparent}
.in{height:56px;border-radius:var(--r-input);background:var(--surface);border:1px solid var(--outline);padding:0 16px;font:400 16px var(--fb);color:var(--text);width:100%}.in:focus{outline:2px solid var(--primary);outline-offset:1px}
.nav{position:absolute;left:16px;right:16px;bottom:16px;height:68px;border-radius:28px;background:var(--surface);box-shadow:var(--sh2);display:flex;padding:0 8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text2);font:500 12px var(--fb);min-height:48px}.nav button.on{color:var(--primary);font-weight:700;background:linear-gradient(160deg,color-mix(in srgb,var(--secondary) 30%,transparent),color-mix(in srgb,var(--moss) 14%,transparent));border-radius:22px}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font:700 12px var(--fb);border:1px solid currentColor}
.rise{animation:rise .32s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*45ms)}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px}.row::-webkit-scrollbar{display:none}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* ===== OLEO-STYLE LAYER: mint + deep green + yellow accent ===== */
:root{--bg:#EDF7F0;--surface:#FFFFFF;--primary:#0E5C40;--secondary:#7FBF9B;--yellow:#FFE53B;--g-main:linear-gradient(135deg,#0B5C3E 0%,#127A52 55%,#23895F 100%);--g-bg:linear-gradient(180deg,#F5FBF7 0%,#E3F3E9 55%,#CDE8D7 100%);--g-card:linear-gradient(160deg,#FFFFFF,#F0F9F3)}
.nav{background:var(--g-main);box-shadow:0 14px 32px rgba(11,92,62,.35)}
.nav button{gap:0;color:color-mix(in srgb,var(--onPrimary) 72%,transparent);transition:color .25s}
.nav button.on{background:none;color:var(--onPrimary)}
.nav button svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:50%;transition:background .3s,color .3s,transform .35s cubic-bezier(.22,1,.36,1)}
.nav button.on svg{background:var(--yellow);color:#0B3D2A;transform:translateY(-3px)}
.stat{min-width:150px;background:var(--g-card),var(--surface);border-radius:20px;padding:14px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:10px}
.sico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--secondary) 28%,transparent);color:var(--primary)}
.num{font:700 32px/36px var(--fb);letter-spacing:-.5px}
.pill{align-self:flex-start;font:500 11px/16px var(--fb);padding:2px 8px;border-radius:999px}
.pill.up{background:#DDF3E4;color:#17703F}.pill.dn{background:#FCE3E1;color:#B3261E}
.tag{font:500 10px/14px var(--fb);padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--text2)}
.panel{background:var(--g-card),var(--surface);border-radius:24px;padding:16px;box-shadow:var(--sh1);margin:0 20px}
.tcard{transition:transform .35s cubic-bezier(.22,1,.36,1)}.tcard:active{transform:scale(.97)}
.bar{transform-origin:bottom;animation:grow .7s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*70ms + 200ms);border-radius:8px 8px 4px 4px}
@keyframes grow{from{transform:scaleY(0)}}
.tip{position:absolute;background:var(--yellow);color:#2A2400;border-radius:10px;padding:4px 10px;font:700 12px/16px var(--fb);box-shadow:0 6px 14px rgba(0,0,0,.15);transform:translateX(-50%);white-space:nowrap;transition:left .4s cubic-bezier(.22,1,.36,1),bottom .4s cubic-bezier(.22,1,.36,1);animation:pop .4s 1s both}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.8)}}
@media (prefers-reduced-motion:reduce){.bar,.tip{animation:none}.nav button svg,.tcard,.tip{transition:none}}
/* ===== AQUA + ORANGE TRAVEL LAYER ===== */
:root{--bg:#E4F8F3;--surface:#FFFFFF;--primary:#0F3D46;--onPrimary:#2B1500;--secondary:#5FD3D0;--accent:#B45F0A;--text:#0F3D46;--text2:#4B6A70;--outline:#CFE8EA;--orange:#FF9A3D;--g-main:linear-gradient(135deg,#FF8A2B 0%,#FFA24A 100%);--g-bg:linear-gradient(165deg,#E3FAF2 0%,#CDF1F7 48%,#F8F4DC 100%);--g-card:linear-gradient(160deg,rgba(255,255,255,.92),rgba(236,250,250,.85))}
:root[data-theme=dark]{--bg:#0A1C20;--surface:#112A30;--primary:#6FE0D6;--onPrimary:#2B1500;--secondary:#2E8F96;--accent:#FFB766;--text:#E8F6F5;--text2:#9CC0C2;--outline:#1F4249;--g-main:linear-gradient(135deg,#FF8A2B 0%,#FFA24A 100%);--g-bg:linear-gradient(165deg,#0A1C20 0%,#0E2A30 50%,#13303A 100%);--g-card:linear-gradient(160deg,#133038,#0F262C)}
.nav{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 34px rgba(15,61,70,.18)}
:root[data-theme=dark] .nav{background:rgba(17,42,48,.88)}
.nav button{color:var(--text2)}.nav button.on{color:var(--text)}.nav button.on svg{background:var(--orange);color:#2B1500}
.glass{background:rgba(255,255,255,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:6px 12px;font:500 12px/16px var(--fb);color:#0F3D46;display:inline-flex;align-items:center;gap:6px}
.tl{position:relative;padding-left:28px}.tl::before{content:'';position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--orange),var(--outline))}
.dot{position:absolute;left:-25px;width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 28%,transparent)}
.sheet{background:var(--surface);border-radius:28px 28px 0 0}
.scribble{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s .3s cubic-bezier(.22,1,.36,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.fav{transition:transform .25s cubic-bezier(.22,1,.36,1)}.fav.pop{transform:scale(1.18)}
@media (prefers-reduced-motion:reduce){.scribble{animation:none;stroke-dashoffset:0}.fav{transition:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="phone"><div id="app" class="absolute inset-0"></div><div id="toast" class="absolute left-5 right-5 bottom-24 hidden rounded-2xl bg-pr text-onpr px-4 py-3 bodys text-center" style="box-shadow:var(--sh2)"></div></div>
<script>
const I={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',compass:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z',bookmark:'M6 3h12v18l-6-4-6 4z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z',back:'M15 5l-7 7 7 7',moon:'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z',check:'M5 12l5 5 9-10',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',flag:'M5 21V4h12l-2 4 2 4H5',chev:'M9 5l7 7-7 7',pin:'M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'};
const ic=(n,s=22,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const D=[
{id:1,n:'Sreemangal',r:'Sylhet Division',p:3200,s:4.8,c:'Tea Gardens',a:['#2F6B4A','#A8C98B'],d:'Rolling emerald tea estates, misty dawns and the quiet of Lawachara rainforest. Walk the hills, taste seven-layer tea, stay in a garden bungalow.'},
{id:2,n:'Cox’s Bazar',r:'Chattogram Division',p:5400,s:4.7,c:'Beaches',a:['#1F6F8B','#E8D9B0'],d:'The longest natural sea beach in the world. Sunrise walks, fresh seafood and a calm stretch at Inani.'},
{id:3,n:'Sundarbans',r:'Khulna Division',p:6800,s:4.9,c:'Forests',a:['#164A36','#6FA58A'],d:'Drift through the mangrove delta by boat, home of the Royal Bengal tiger and spotted deer.'},
{id:4,n:'Bandarban',r:'Chattogram Division',p:4500,s:4.8,c:'Hills',a:['#3E5C76','#B7C9A8'],d:'Cloud-level hill trails, tribal villages and waterfalls above the Sangu river.'},
{id:5,n:'Sajek Valley',r:'Rangamati',p:3900,s:4.6,c:'Hills',a:['#4A6B3A','#D6C58C'],d:'A ridge of clouds and green slopes. Stay in a hilltop cottage and watch the sky change.'}];
const B=[{n:'Sreemangal',d:'12–14 Nov',t:'৳ 6,400',st:'Confirmed',k:'ok',i:'check'},{n:'Sundarbans',d:'02–05 Dec',t:'৳ 20,400',st:'Pending',k:'wait',i:'clock'},{n:'Cox’s Bazar',d:'03–06 Sep',t:'৳ 16,200',st:'Completed',k:'done',i:'flag'}];
const art=(x,inner='',cls='')=>`<div class="art ${cls}" style="background:radial-gradient(circle at 85% 12%,rgba(255,236,170,.55),rgba(255,236,170,0) 45%),linear-gradient(160deg,${x.a[0]},${x.a[1]})"><svg viewBox="0 0 100 60" preserveAspectRatio="none" class="absolute inset-x-0 bottom-0 w-full h-1/2"><path d="M0 40Q25 20 50 36T100 28V60H0Z" fill="rgba(255,255,255,.18)"/><path d="M0 50Q30 34 60 48T100 42V60H0Z" fill="rgba(0,0,0,.2)"/></svg><div class="scrim"></div>${inner}</div>`;
const money=n=>'৳ '+n.toLocaleString('en-US');
let S={scr:'login',id:1,cat:'All',dark:matchMedia('(prefers-color-scheme: dark)').matches};
const cats=['All','Beaches','Hills','Forests','Tea Gardens'];
const chips=()=>`<div class="row">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>`;

const hero=(x,i)=>`<button data-open="${x.id}" class="rise text-left shrink-0" style="--i:${i};width:236px">${art(x,`<div class="absolute left-4 right-4 bottom-4"><div class="title">${x.n}</div><div class="bodys opacity-90 flex items-center gap-1">${ic('pin',14)}${x.r}</div><div class="flex justify-between items-center mt-2"><span class="titles">${money(x.p)}</span><span class="label flex items-center gap-1">${ic('star',14,1)}${x.s}</span></div></div>`,'')}</button>`.replace('class="art "','class="art " ').replace('<div class="art','<div style="aspect-ratio:4/5;border-radius:24px" class="art');
const wide=(x,i)=>`<button data-open="${x.id}" class="rise w-full text-left" style="--i:${i}">${art(x,`<div class="absolute left-4 right-4 bottom-4 flex justify-between items-end"><div><div class="title">${x.n}</div><div class="bodys opacity-90">${x.r}</div></div><div class="titles">${money(x.p)}</div></div>`,'').replace('<div class="art','<div style="aspect-ratio:16/10;border-radius:24px" class="art')}</button>`;
const nav=t=>`<nav class="nav" aria-label="Main">${[['home','Home','home'],['explore','Explore','compass'],['bookings','Bookings','bookmark'],['profile','Profile','user']].map(([k,l,i])=>`<button data-go="${k}" class="${t===k?'on':''}" ${t===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')}</nav>`;
const V={
login:()=>`<div class="scr" style="padding-bottom:0">${art({a:['#1F4D3A','#8FB39A']},`<div class="absolute left-6 right-6 bottom-8"><div class="display">ComfyGo</div><div class="body opacity-90 mt-1">Travel Bangladesh, comfortably.</div></div>`).replace('<div class="art','<div style="height:330px" class="art')}
<div class="bg-sf px-6 pt-7 pb-8 -mt-6 relative" style="border-radius:28px 28px 0 0;box-shadow:var(--sh2)"><div class="headline mb-5">Welcome back</div>
<label class="label text-tx2 block mb-2" for="em">Email address</label><input id="em" class="in mb-4" type="email" value="partho@example.com">

<button class="btn w-full" data-go="home">Sign in</button><p class="bodys text-tx2 text-center mt-5">New to ComfyGo? <b class="text-pr">Create an account</b></p></div></div>`,
home:()=>`<div class="scr"><div class="px-5 pt-6 flex items-start justify-between"><div><div class="bodys text-tx2">Good morning, Partho</div><div class="headline mt-1" style="max-width:260px">Where will you wake up next?</div></div><button data-dark class="w-12 h-12 rounded-full bg-sf grid place-items-center text-pr" style="box-shadow:var(--sh1)" aria-label="Toggle dark mode">${ic('moon')}</button></div>

<div class="px-5 pt-5"><div class="flex items-center gap-3"><span class="badge text-pr">${x.c}</span><span class="bodys flex items-center gap-1 text-ac font-bold">${ic('star',16,1)}${x.s} rating</span></div><div class="title mt-5">About this place</div><p class="body text-tx2 mt-2">${x.d}</p><div class="title mt-6">Included</div><div class="grid grid-cols-2 gap-3 mt-3">${['Local guide','Hotel stay','Transport','Meals'].map(t=>`<div class="card p-4 bodys flex items-center gap-2"><span class="text-pr">${ic('check',18)}</span>${t}</div>`).join('')}</div></div></div>
<div class="absolute left-0 right-0 bottom-0 bg-sf px-5 py-4 flex items-center justify-between" style="border-radius:28px 28px 0 0;box-shadow:var(--sh2)"><div><div class="label text-tx2">From, per person</div><div class="title text-ac">${money(x.p)}</div></div><button class="btn px-8" data-book>Book now</button></div>`},

<div class="px-5 mt-7 grid gap-3">${[['Edit profile','user'],['Saved places','bookmark'],['Help and support','compass']].map(([t,i])=>`<div class="card px-4 h-16 flex items-center gap-3"><span class="text-pr">${ic(i)}</span><span class="body flex-1">${t}</span><span class="text-tx2">${ic('chev',18)}</span></div>`).join('')}
<button data-dark class="card px-4 h-16 flex items-center gap-3 text-left"><span class="text-pr">${ic('moon')}</span><span class="body flex-1">Dark mode</span><span class="relative w-12 h-7 rounded-full" style="background:${S.dark?'var(--primary)':'var(--outline)'}"><i class="absolute top-1 w-5 h-5 rounded-full bg-white" style="left:${S.dark?'24px':'4px'};transition:left .2s"></i></span></button>

};
const root=document.documentElement;
const SP=[1.6,2.3,1.8,2.6,1.9,1.0],MO=['Jul','Aug','Sep','Oct','Nov','Dec'];S.bar=2;
const scene=(x,i)=>`<svg viewBox='0 0 200 120' preserveAspectRatio='xMidYMid slice' style='width:100%;height:100%;display:block' aria-hidden='true'><defs><linearGradient id='sk${i}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${x.a[1]}'/><stop offset='1' stop-color='#FFF3C4'/></linearGradient></defs><rect width='200' height='120' fill='url(#sk${i})'/><circle cx='150' cy='30' r='14' fill='#FFE53B'/><path d='M0 85Q40 55 90 80T200 70V120H0Z' fill='${x.a[0]}' opacity='.55'/><path d='M0 100Q50 78 110 98T200 90V120H0Z' fill='${x.a[0]}'/><g fill='#0E5C40'><rect x='34' y='82' width='4' height='16'/><circle cx='36' cy='76' r='11'/><rect x='150' y='86' width='4' height='14'/><circle cx='152' cy='80' r='9'/></g></svg>`;
const tcard=(x,i)=>{const t=['#BFE5CE','#FFD9B8','#BFE5CE','#F8C9CF'][i%4];return `<button data-open='${x.id}' class='tcard rise shrink-0 text-left' style='--i:${i};width:200px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,${t} 35%,var(--surface)));box-shadow:var(--sh1)'><div style='height:112px'>${scene(x,i)}</div><div class='p-3'><div class='flex gap-2 mb-2'><span class='tag'>Travel</span><span class='tag'>${x.c}</span></div><div class='titles' style='font-size:15px;line-height:20px'>${x.n}</div><div class='label text-tx2 mt-2'>Tue, 24 Sep</div></div></button>`};
const stat=(l,v,d,p,up,i,n)=>`<div class='stat rise shrink-0' style='--i:${i}'><div class='flex items-center gap-2 text-tx2 bodys'><span class='sico'>${ic(n,16)}</span>${l}</div><div class='num' data-n='${v}' data-d='${d}'>0</div><span class='pill ${up?'up':'dn'}'>${p} vs last month</span></div>`;
V.home=()=>`<div class='scr'><div class='px-5 pt-6 flex items-center justify-between'><div><div class='label text-tx2'>Home / <b class='text-pr'>Bangladesh</b></div><div class='headline mt-1'>Good morning, Partho</div></div><button data-dark class='w-12 h-12 rounded-full grid place-items-center text-pr shrink-0' style='background:var(--g-card),var(--surface);box-shadow:var(--sh1)' aria-label='Toggle dark mode'>${ic('moon')}</button></div>
<div class='px-5 mt-4'><button data-go='explore' class='in flex items-center gap-3 text-tx2 text-left'>${ic('search')}Search destinations</button></div>
<div class='row mt-4'>${stat('Trips booked',12,0,'+12%',1,0,'bookmark')+stat('Avg rating',4.8,1,'+4%',1,1,'star')+stat('Saved places',36,0,'−4%',0,2,'pin')+stat('Km travelled',1432,0,'+16%',1,3,'compass')}</div>
<div class='panel mt-5'><div class='flex items-center justify-between mb-3'><div class='titles flex items-center gap-2'><span class='sico'>${ic('compass',16)}</span>Recent trips</div><button data-go='explore' class='bodys font-bold text-pr min-h-[48px]'>See all</button></div><div class='row' style='padding:0'>${D.slice(0,4).map(tcard).join('')}</div></div>
<div class='mt-5 mx-5 rise' style='--i:3;border-radius:24px;padding:20px;background:linear-gradient(160deg,#E9F7EE,#BFE5CE);color:#0E3B2A;box-shadow:var(--sh1);display:flex;align-items:center;gap:16px'><div class='relative shrink-0' style='width:112px;height:112px'><svg viewBox='0 0 120 120' width='112' height='112'><defs><linearGradient id='rg'><stop offset='0' stop-color='#0E5C40'/><stop offset='1' stop-color='#7FD1A5'/></linearGradient></defs><circle cx='60' cy='60' r='48' fill='none' stroke='rgba(255,255,255,.75)' stroke-width='12'/><circle id='ring' cx='60' cy='60' r='48' fill='none' stroke='url(#rg)' stroke-width='12' stroke-linecap='round' stroke-dasharray='301.6' stroke-dashoffset='301.6' transform='rotate(-90 60 60)' style='transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)'/></svg><div class='absolute inset-0 grid place-items-center text-center'><div><div class='titles'>60%</div><div class='label'>Completed</div></div></div></div><div><div class='title'>Goal completed this year</div><div class='bodys mt-1'>3 of 5 trips done. Two more to unlock the Explorer badge.</div></div></div>
<div class='panel mt-5'><div class='flex items-center justify-between'><div class='titles flex items-center gap-2'><span class='sico'>${ic('flag',16)}</span>Trip spending</div><span class='tag'>Last 6 months</span></div><div id='chart' class='relative mt-10' style='height:140px;display:flex;align-items:flex-end;gap:10px'>${SP.map((v,i)=>`<button data-bar='${i}' class='bar flex-1' style='--i:${i};height:${v/4*100}%;background:linear-gradient(180deg,${i===S.bar?'#2F9467':'#7DBE9A'},#D5EADD)' aria-label='${MO[i]} ${money(v*1000)}'></button>`).join('')}<div class='tip' id='tip'></div></div><div class='flex mt-2'>${MO.map(m=>`<div class='flex-1 text-center label text-tx2'>${m}</div>`).join('')}</div></div></div>${nav('home')}`;
Object.assign(I,{heart:'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',filter:'M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4'});
V.signin=V.login;
V.login=()=>`<div class='scr' style='padding-bottom:0'><div class='relative' style='height:470px'><div class='absolute rise' style='left:22px;top:70px;width:150px;height:200px;border-radius:18px;overflow:hidden;transform:rotate(-8deg);box-shadow:var(--sh2);--i:0'>${scene(D[1],11)}</div><div class='absolute rise' style='right:20px;top:46px;width:170px;height:210px;border-radius:18px;overflow:hidden;transform:rotate(7deg);box-shadow:var(--sh2);--i:1'>${scene(D[3],12)}</div><div class='absolute rise' style='left:105px;top:130px;width:180px;height:250px;border-radius:22px;overflow:hidden;border:5px solid rgba(255,255,255,.75);box-shadow:var(--sh2);--i:2'>${scene(D[0],13)}<span class='glass absolute' style='left:8px;top:8px'>Sreemangal, Sylhet</span></div><svg class='absolute' viewBox='0 0 390 470' style='inset:0;width:100%;height:100%;pointer-events:none' aria-hidden='true'><path class='scribble' d='M30 300C20 160 170 120 320 170C380 195 370 290 250 330C140 365 40 345 60 270' fill='none' stroke='#FF9A3D' stroke-width='9' stroke-linecap='round'/></svg></div><div class='px-6'><div class='display' style='max-width:300px'>Travel and share moments with us</div><p class='bodys text-tx2 mt-3' style='max-width:290px'>Share the moments that matter, connect with fellow travellers and turn every journey into a story.</p><div class='flex items-center justify-between mt-7'><button data-go='signin' class='bodys font-bold text-pr min-h-[48px]'>Sign in</button><button data-go='home' class='btn px-8'>Get started</button></div></div></div>`;
const photo=(x,i)=>`<button data-open='${x.id}' class='rise w-full text-left relative block' style='--i:${i};border-radius:28px;overflow:hidden;aspect-ratio:4/3;box-shadow:var(--sh2)'><div class='absolute inset-0'>${scene(x,i+20)}</div><div class='absolute left-3 top-3 flex gap-2'><span class='glass'>${ic('user',14)}7–9</span><span class='glass'>${ic('pin',14)}${x.r.split(' ')[0]}</span><span class='glass'>3 days</span></div><div class='absolute inset-x-0 bottom-0 p-4 text-white' style='background:linear-gradient(180deg,transparent,rgba(5,30,36,.78))'><div class='title'>${x.n}</div><div class='flex justify-between mt-1'><span class='bodys'>${x.c}</span><span class='titles'>${money(x.p)}</span></div></div></button>`;
V.home=()=>`<div class='scr'><div class='px-5 pt-6 flex items-start justify-between gap-3'><div><div class='display' style='max-width:270px'>Explore Bangladesh. Find yourself.</div><div class='bodys text-tx2 mt-2'>It’s about the stories you bring home</div></div><button data-dark class='glass shrink-0' style='width:48px;height:48px;padding:0;justify-content:center;color:var(--text)' aria-label='Toggle dark mode'>${ic('moon')}</button></div>
<div class='px-5 mt-5'><button data-go='explore' class='in flex items-center gap-3 text-tx2 text-left' style='border-radius:999px;background:var(--g-card);font-size:14px'>${ic('search')}<span class='flex-1'>Search place, district etc.</span>${ic('filter')}</button></div>
<div class='mt-4'>${chips()}</div>
<div class='px-5 mt-5 grid gap-4'>${list().slice(0,3).map(photo).join('')||'<p class="body text-tx2">No places here yet. Try another filter.</p>'}</div>
<div class='px-5 mt-7 flex items-center justify-between'><div class='title'>Your itinerary</div><span class='label text-tx2'>12 Nov</span></div>
<div class='px-5'><div class='tl mt-3'>${[['12:45 – 02:00 pm','Check-in, tea garden bungalow',D[0]],['02:15 – 04:30 pm','Lawachara forest walk',D[2]],['05:00 – 06:30 pm','Sunset over the tea estate',D[3]]].map(([t,n,x],i)=>`<div class='relative mb-3 rise' style='--i:${i}'><span class='dot' style='top:24px'></span><div class='card p-3 flex items-center gap-3'><div class='flex-1'><div class='label text-tx2 flex items-center gap-1'>${ic('clock',14)}${t}</div><div class='titles mt-1' style='font-size:15px;line-height:20px'>${n}</div></div><div style='width:56px;height:56px;border-radius:14px;overflow:hidden'>${scene(x,i+30)}</div></div></div>`).join('')}</div></div></div>${nav('home')}`;
V.detail=()=>{const x=D.find(d=>d.id===S.id);return `<div class='scr' style='padding-bottom:0'><div style='height:400px'>${scene(x,40)}</div><div class='sheet relative' style='margin-top:-28px;padding:20px 20px 120px;box-shadow:0 -12px 32px rgba(15,61,70,.12)'><div class='flex items-center gap-2'><div class='flex'>${['R','N','T'].map((c,i)=>`<span class='grid place-items-center label' style='width:28px;height:28px;border-radius:50%;margin-left:${i?-8:0}px;border:2px solid var(--surface);background:linear-gradient(160deg,#5FD3D0,#FF9A3D);color:#2B1500'>${c}</span>`).join('')}</div><span class='bodys text-tx2'>100+ people have explored</span></div><div class='title mt-3' style='font-size:24px'>${x.n}</div><div class='bodys text-tx2 mt-1'>${x.r}, Bangladesh</div><div class='bodys mt-3 flex items-center gap-1 font-bold' style='color:var(--accent)'>${ic('star',16,1)}${x.s}<span class='text-tx2 font-normal ml-1'>(212 reviews)</span></div><div class='flex gap-5 mt-4 py-3' style='border-top:1px solid var(--outline);border-bottom:1px solid var(--outline)'>${[['Safe area','shield'],['Local guide','user'],['Transport','compass']].map(([t,i])=>`<span class='label flex items-center gap-2 text-tx2'>${ic(i,16)}${t}</span>`).join('')}</div><p class='bodys text-tx2 mt-4' style='line-height:22px'>${x.d}</p></div></div><button data-go='home' class='glass absolute' style='left:16px;top:20px;width:48px;height:48px;padding:0;justify-content:center' aria-label='Back'>${ic('back')}</button><div class='absolute inset-x-0 bottom-0 sheet flex items-center gap-3 px-5 py-4' style='box-shadow:0 -10px 28px rgba(15,61,70,.14)'><button data-fav class='fav grid place-items-center text-pr shrink-0' style='width:56px;height:56px;border-radius:50%;background:var(--bg)' aria-label='Save to favourites'>${ic('heart')}</button><button class='btn flex-1' data-book>Book from ${money(x.p)}</button></div>`};
document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(!f)return;const on=f.dataset.on!=='1';f.dataset.on=on?'1':'0';f.style.color=on?'#FF7A00':'';f.innerHTML=ic('heart',22,on);f.classList.add('pop');setTimeout(()=>f.classList.remove('pop'),250)});
function moveTip(){const c=document.getElementById('chart'),tp=document.getElementById('tip');if(!c)return;const b=c.querySelector(`[data-bar='${S.bar}']`);tp.textContent='+'+money(SP[S.bar]*1000);tp.style.left=b.offsetLeft+b.offsetWidth/2+'px';tp.style.bottom=b.offsetHeight+8+'px'}
function after(){if(S.scr!=='home')return;const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('.num').forEach(el=>{const n=+el.dataset.n,d=+el.dataset.d,f=v=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});if(rm){el.textContent=f(n);return}const t0=performance.now();(function s(t){const p=Math.min((t-t0)/900,1);el.textContent=f(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)});requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=document.getElementById('ring');if(r)r.style.strokeDashoffset=301.6*0.4;moveTip()}))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-bar]');if(!b)return;S.bar=+b.dataset.bar;document.querySelectorAll('[data-bar]').forEach((el,i)=>el.style.background=`linear-gradient(180deg,${i===S.bar?'#2F9467':'#7DBE9A'},#D5EADD)`);moveTip()});
function render(){root.setAttribute('data-theme',S.dark?'dark':'light');document.getElementById('app').innerHTML=V[S.scr]();after();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2200)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-open],[data-cat],[data-dark],[data-book]');if(!t)return;
if(t.dataset.go)S.scr=t.dataset.go;else if(t.dataset.open){S.id=+t.dataset.open;S.scr='detail'}else if(t.dataset.cat)S.cat=t.dataset.cat;else if('dark' in t.dataset)S.dark=!S.dark;else if('book' in t.dataset){toast('Booking request sent');return}
render()});
render();
</script>
